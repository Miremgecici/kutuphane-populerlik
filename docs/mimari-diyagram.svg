<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="okm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .zone{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:9 6}
      .zl{font-size:13px;font-weight:bold;fill:#b91c1c}
      .box{stroke-width:1.6}
      .t{font-size:15px;font-weight:bold;fill:#111827}
      .s{font-size:12px;fill:#374151}
      .a{stroke:#1f2937;stroke-width:1.8;fill:none;marker-end:url(#ok)}
      .d{stroke:#7c3aed;stroke-width:1.8;fill:none;marker-end:url(#okm);stroke-dasharray:6 4}
      .al{font-size:12px;fill:#111827;font-weight:bold}
      .alm{font-size:12px;fill:#6d28d9;font-weight:bold}
    </style>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>

  <text x="30" y="40" font-size="22" font-weight="bold" fill="#111827">Kütüphane Popülerlik Karşılaştırıcı — Bulut Mimarisi (taslak)</text>
  <text x="30" y="64" font-size="13" fill="#4b5563">Müesser İrem Gecici · 2516016027 · Bulut Bilişim ve Siber Güvenlik · Ara kontrol 26.10.2026 · Canlı: kutuphane-populerlik.pages.dev · Cloudflare Pages (0 TL)</text>

  <!-- ZONES -->
  <rect class="zone" x="30" y="90" width="230" height="600" rx="14"/>
  <text class="zl" x="44" y="110">GS-1 İnternet</text>
  <text class="s" x="44" y="126">(güvenilmeyen bölge)</text>

  <rect class="zone" x="290" y="90" width="640" height="280" rx="14"/>
  <text class="zl" x="304" y="110">GS-2 Cloudflare hesabı (yayın ve uç ağ)</text>

  <rect class="zone" x="290" y="420" width="640" height="270" rx="14"/>
  <text class="zl" x="304" y="440">GS-3 GitHub</text><text class="s" x="304" y="456">(kod, veri, CI)</text>

  <rect class="zone" x="960" y="420" width="290" height="270" rx="14"/>
  <text class="zl" x="974" y="440">GS-4 Üçüncü taraf veri API'leri</text>

  <!-- GS-1 -->
  <rect class="box" rx="10" x="50" y="145" width="190" height="100" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="62" y="171">Kullanıcı tarayıcısı</text>
  <text class="s" x="62" y="191">Statik HTML/CSS/JS</text>
  <text class="s" x="62" y="209">Anahtar YOK</text>
  <text class="s" x="62" y="227">Yalnızca HTTPS</text>

  <rect class="box" rx="10" x="50" y="470" width="190" height="115" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="62" y="496">Geliştirici</text>
  <text class="s" x="62" y="516">GitHub + Cloudflare</text>
  <text class="s" x="62" y="534">MFA / passkey</text>
  <text class="s" x="62" y="552">Kurtarma kodları saklı</text>
  <text class="s" x="62" y="570">(kart: hesap ele geçirme)</text>

  <!-- GS-2 -->
  <rect class="box" rx="10" x="320" y="140" width="280" height="105" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t" x="332" y="166">Cloudflare Pages + CDN</text>
  <text class="s" x="332" y="186">Derleme: scripts/build_site.sh → _site</text>
  <text class="s" x="332" y="204">IaC: wrangler.toml</text>
  <text class="s" x="332" y="222">HTTPS zorunlu (.dev HSTS ön yüklü)</text>

  <rect class="box" rx="10" x="640" y="140" width="260" height="105" fill="#fef3c7" stroke="#d97706"/>
  <text class="t" x="652" y="166">Güvenlik başlıkları</text>
  <text class="s" x="652" y="186">_headers: CSP (inline yok), HSTS</text>
  <text class="s" x="652" y="204">nosniff, Referrer/Permissions-</text>
  <text class="s" x="652" y="222">Policy, frame-ancestors 'none'</text>

  <rect class="box" rx="10" x="640" y="265" width="260" height="85" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="652" y="291">Cloudflare hesap IAM</text>
  <text class="s" x="652" y="311">MFA, en az yetkili üye/rol</text>
  <text class="s" x="652" y="329">Bildirim/alarm (27-28 Ekim)</text>

  <!-- GS-3 -->
  <rect class="box" rx="10" x="320" y="470" width="280" height="120" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="332" y="496">GitHub deposu (public)</text>
  <text class="s" x="332" y="516">data/npm.json, data/pypi.json</text>
  <text class="s" x="332" y="534">Branch protection (main)</text>
  <text class="s" x="332" y="552">Secret scanning, Dependabot</text>
  <text class="s" x="332" y="570">Depoda gizli bilgi YOK</text>

  <rect class="box" rx="10" x="640" y="470" width="260" height="120" fill="#dcfce7" stroke="#16a34a"/>
  <text class="t" x="652" y="496">GitHub Actions: "Veri çek"</text>
  <text class="s" x="652" y="516">Günde 1 (cron 03:17 UTC)</text>
  <text class="s" x="652" y="534">Yerleşik GITHUB_TOKEN</text>
  <text class="s" x="652" y="552">permissions: contents: write</text>
  <text class="s" x="652" y="570">İstekler arası 2 sn bekleme</text>

  <!-- GS-4 -->
  <rect class="box" rx="10" x="985" y="470" width="240" height="75" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="997" y="496">npm downloads API</text>
  <text class="s" x="997" y="516">Günlük indirme sayıları</text>
  <text class="s" x="997" y="533">Anahtarsız</text>

  <rect class="box" rx="10" x="985" y="575" width="240" height="75" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="997" y="601">pypistats.org API</text>
  <text class="s" x="997" y="621">Günlük indirme sayıları</text>
  <text class="s" x="997" y="638">Anahtarsız</text>

  <!-- FLOWS -->
  <line class="a" x1="902" y1="505" x2="983" y2="505"/>
  <text class="al" x="915" y="497">①</text>
  <path class="a" d="M902,560 L940,560 L940,612 L983,612"/>
  <text class="al" x="948" y="600">①</text>

  <line class="a" x1="638" y1="530" x2="602" y2="530"/>
  <text class="al" x="608" y="522">②</text>

  <line class="a" x1="460" y1="468" x2="460" y2="247"/>
  <text class="al" x="305" y="290">③ push → yayınla</text>
  <text class="s" x="305" y="306">Cloudflare GitHub App</text>
  <text class="s" x="305" y="322">(yalnızca bu depo)</text>

  <line class="a" x1="240" y1="192" x2="318" y2="192"/>
  <text class="al" x="250" y="184">④</text>

  <line class="a" x1="602" y1="192" x2="638" y2="192"/>

  <line class="a" x1="240" y1="530" x2="318" y2="530"/>
  <text class="al" x="250" y="522">⑤</text>

  <path class="d" d="M240,490 L272,490 L272,395 L620,395 L620,307 L638,307"/>
  <text class="alm" x="280" y="390">⑥ yönetim girişi (MFA)</text>

  <!-- LEGEND -->
  <text x="30" y="730" font-size="13" font-weight="bold" fill="#111827">Akışlar:</text>
  <text x="95" y="730" font-size="12" fill="#374151">① Actions günlük indirme verisini çeker (anahtarsız, hız sınırına uygun)   ② JSON dosyalarını depoya yazar</text>
  <text x="95" y="750" font-size="12" fill="#374151">③ main'e her push'ta Cloudflare Pages siteyi derleyip yayınlar   ④ kullanıcı sayfayı ve aynı kökenden data/*.json'u HTTPS ile alır</text>
  <text x="95" y="770" font-size="12" fill="#374151">⑤ kod değişikliği PR ile (doğrudan push kapalı)   ⑥ geliştiricinin Cloudflare paneline girişi (MFA, en az yetki)</text>
  <line x1="30" y1="800" x2="70" y2="800" stroke="#dc2626" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="78" y="804" font-size="12" fill="#374151">Güven sınırı (GS) — veri bu çizgiyi geçerken kimlik doğrulama veya doğrulama yapılır.</text>
  <text x="30" y="828" font-size="12" fill="#374151">Gizli bilgi: ürün anahtar gerektiren hiçbir kaynak kullanmaz; dağıtım token'ı da yoktur (Git entegrasyonu). CI yalnızca GitHub'ın kısa ömürlü GITHUB_TOKEN'ını kullanır.</text>
</svg>
