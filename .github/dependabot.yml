# Bağımlılık taraması: GitHub Actions sürümlerini haftalık kontrol eder.
# (Python script'i yalnızca standart kütüphaneyi kullanır; npm bağımlılığı yoktur.)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]
