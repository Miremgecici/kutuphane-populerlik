name: Veri çek

# Her gün npm ve pypistats API'lerinden (anahtarsız) indirme sayılarını çeker.
# main dalı korumalı olduğu için doğrudan push yapılmaz: değişiklik ayrı bir dala
# yazılır, PR açılır ve PR birleştirilir (branch protection ile uyumlu).
on:
  schedule:
    - cron: "17 3 * * *"   # her gün 03:17 UTC (06:17 TSİ)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma butonu

# Varsayılan: hiçbir izin yok. İzinler yalnızca ihtiyaç duyan işe verilir.
permissions: {}

concurrency:
  group: veri-cek
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # veri dalını push etmek ve PR'ı birleştirmek için
      pull-requests: write   # PR açmak için
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: npm ve pypistats verisini çek
        run: python scripts/fetch_data.py

      - name: Değişikliği PR ile ana dala al
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pr_ile_birlestir.sh veri "Veri güncellemesi: $(date -u +'%Y-%m-%d %H:%M UTC')" data/
